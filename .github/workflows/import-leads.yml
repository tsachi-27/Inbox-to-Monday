name: Import ATI leads to Monday.com

# The real scheduler is an external cron-job.org job hitting the deployed
# Vercel API route every 5 minutes directly. This workflow is manual-trigger
# only (Actions tab -> Run workflow), for testing - it deliberately does NOT
# have its own `schedule` trigger. We tried that first, but GitHub's own
# scheduler proved unreliable for a 5-minute cadence (confirmed via the
# Actions API: the schedule event never fired even after 10+ minutes), and
# running two independent schedulers against the same endpoint risks a race
# condition where both see a new lead as "unprocessed" at the same instant
# and create a duplicate Monday item.
on:
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Call the import-leads endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/import-leads")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP status: $http_code"
          echo "$body" | jq . || echo "$body"

          if [ "$http_code" -ne 200 ]; then
            echo "::error::Request failed with HTTP $http_code"
            exit 1
          fi

          error_count=$(echo "$body" | jq -r '.summary.error // 0')
          if [ "$error_count" -gt 0 ]; then
            echo "::error::$error_count lead(s) failed to push - see output above"
            exit 1
          fi
